services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mlops:mlops@db:5432/mlops
      ENVIRONMENT: docker
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Async deployment worker: same image as backend, different entrypoint.
  # Consumes the deployments queue (LISTEN/NOTIFY + poll). The backend owns
  # migrations; the worker waits for the schema before starting.
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://mlops:mlops@db:5432/mlops
      ENVIRONMENT: docker
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]
