[project]
name = "mlops-platform-backend"
version = "0.1.0"
description = "MLOps control-plane backend (registry, deployments, monitoring)."
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
# Alembic migrations are generated and versioned as-is; don't lint/reformat them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI relies on `Depends(...)`/`Query(...)` as call-in-default-argument
# by design, so this check is a false positive for our route signatures.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable inline request fixtures over strict line width.
"tests/**" = ["E501"]
