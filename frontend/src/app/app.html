@if (auth.isAuthenticated()) {
  <mat-toolbar class="app-bar">
    <span class="app-bar-mark">ABB</span>
    <span class="app-bar-title">MLOps Platform</span>
    <span class="app-bar-spacer"></span>

    <button mat-button [matMenuTriggerFor]="menu" class="app-bar-user">
      <mat-icon>account_circle</mat-icon>
      <span class="app-bar-username">{{ auth.currentUser()?.username }}</span>
      <span class="app-bar-role">{{ auth.currentUser()?.role }}</span>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  </mat-toolbar>
}

<main class="app-content">
  <router-outlet />
</main>
